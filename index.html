<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>West End Meat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: one-hand field tool. Sticky header + scrolling tab strip + shared search bar, then card lists. Full-screen sheets for jobs, customers and invoices. */
:root{
  --bg:#f6f1e9; --surface:#ffffff; --surface2:#ece3d6; --ink:#2a211c; --muted:#6e5f53; --line:#ddd1c0;
  --brand:#b1361a; --brand-ink:#ffffff; --brand-soft:#f6dfd7; --logo-bg:#2b2420; --logo-ink:#f6efe6; --logo-line:#b1361a;
  --up:#2a5fa8; --up-soft:#dce8f7; --inv:#9a5f0a; --inv-soft:#fbebcf; --paid:#1b7547; --paid-soft:#d6efe0; --bad:#b3261e; --bad-soft:#fbdedb;
  --paper:#ffffff; --paper-ink:#1a1a1a; --paper-line:#cfcfcf; --paper-muted:#666666;
  --shadow:0 1px 2px rgba(20,40,30,.08),0 4px 14px rgba(20,40,30,.06);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow-x:clip;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--logo-bg)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:980px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) ;padding-inline:max(16px,env(safe-area-inset-left,0px));background:var(--logo-bg);color:var(--logo-ink);border-top:3px solid var(--logo-line);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand{flex:none}
.brand img{display:block;height:56px;width:auto;max-width:none;flex:none}
@media(max-width:480px){.brand img{height:44px}.top .btn{padding:8px 10px}}
.top .btn{white-space:nowrap}.top .wrap{gap:8px}@media(max-width:420px){.top .btn{font-size:13px;padding:8px 8px}.brand img{height:38px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.plogo{display:block;height:84px;width:auto;max-width:none;margin-bottom:8px}
.top .grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn.bad{color:var(--bad);border-color:var(--bad)}
:focus-visible{outline:3px solid var(--up);outline-offset:2px}

/* tabs + search */
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 75px);z-index:15;background:var(--bg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px 9px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tab .ct{display:inline-block;min-width:20px;margin-left:5px;padding:0 6px;border-radius:10px;background:var(--surface2);color:var(--muted);font-size:12px;text-align:center}
.searchrow{padding-block:8px 10px}
.searchrow input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px}

main{padding-top:16px;display:flex;flex-direction:column;gap:18px}
.calbar{display:flex;align-items:center;gap:8px;margin:12px 0 8px}.calbar b{flex:1;text-align:center;font-size:16px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cgrid .wd{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:2px 0}
.cd{min-height:52px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;color:var(--ink);cursor:pointer}
.cd.blank{border:0;background:none;cursor:default}
.cd .n{font-size:14px;font-weight:600}
.cd.today{border-color:var(--up);box-shadow:inset 0 0 0 1px var(--up)}
.cd.sel{background:var(--up-soft);border-color:var(--up)}
.cd .dots{display:flex;gap:3px;align-items:center;font-size:10px;color:var(--muted)}
.cd .dots i{width:7px;height:7px;border-radius:50%;background:var(--up);display:inline-block}.cd .dots i.o{background:var(--inv)}
.calday{margin-top:14px}.calday h3{margin:0 0 8px;font-size:15px}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vhead h2{font-size:22px}
.vhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.group h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-family:var(--f-body);font-weight:700}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.job{display:grid;grid-template-columns:52px 1fr;gap:12px;cursor:pointer;min-width:0}
.job:hover{border-color:var(--brand)}
.dt{width:52px;border-radius:10px;background:var(--surface2);text-align:center;padding:6px 0;line-height:1.1}
.dt span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dt b{font-family:var(--f-display);font-size:22px}
.job .mid{min-width:0}
.job .nm{font-weight:700;overflow-wrap:anywhere}
.job .sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.job .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.job .amt{margin-left:auto;font-weight:700}
.job .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.up{background:var(--up-soft);color:var(--up)} .chip.inv{background:var(--inv-soft);color:var(--inv)}
.chip.paid{background:var(--paid-soft);color:var(--paid)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--muted)}
.banner{background:var(--inv-soft);color:var(--inv);border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.bad{background:var(--bad-soft);color:var(--bad)}

.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.tile b{display:block;font-family:var(--f-display);font-size:26px;margin-top:2px}
.tile em{font-style:normal;font-size:12px;color:var(--muted)}
.tile.warn b{color:var(--bad)}

table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.scroll{overflow-x:auto}

/* sheets */
#modal:empty{display:none}
.backdrop{position:fixed;top:0;left:0;right:0;height:100%;height:100dvh;z-index:50;background:rgba(8,16,12,.55);display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--bg);width:min(760px,100%);max-height:100%;height:100%;display:flex;flex-direction:column;border-radius:0}

/* ---------- pricing ---------- */
const yl=it=>{const y=num(it.yield);return y>0?y:100};

 const pound=x.mode==='pound';(x.menu||[]).forEach(m=>{let need=(pound?num(m.qty):g*m.portion)/(yl(m)/100)*(1+over/100);const lbs=/^lb/i.test(m.unit||'');

function docLines(e){const c=calc(e),L=[];
 if(c.pound)c.items.forEach(i=>{if(i.q>0)L.push({desc:i.name+' (per '+i.unit+')',qty:i.q,rate:i.up,amt:i.total})});
 else if(e.itemize!==false)c.items.forEach(i=>L.push({desc:i.name,qty:c.g,rate:i.pp,amt:i.total}));
 else if(c.items.length)L.push({desc:(e.type||'Catering')+' menu: '+c.items.map(i=>i.name).join(', '),qty:c.g,rate:c.ppItems,amt:c.food});
 if(c.svc&&c.g)L.push({desc:'Service fee',qty:c.g,rate:num(e.svcPP),amt:c.svc});
 if(c.flat)L.push({desc:e.flatLabel||'Flat fee',qty:1,rate:c.flat,amt:c.flat});
 (e.extras||[]).forEach(x=>{if(num(x.amt))L.push({desc:x.desc||'Extra',qty:1,rate:num(x.amt),amt:num(x.amt)})});
 return L}

 <div class="scroll"><table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr></thead><tbody>${L.map(l=>`<tr><td>${esc(l.desc)}</td><td class="r num">${l.qty}</td><td class="r num">${money(l.rate)}</td><td class="r num">${money(l.amt)}</td></tr>`).join('')}

function docText(e){const c=calc(e),s=S.settings,L=docLines(e),isQ=e.status==='quote';
 let t=s.bizName+' - '+(isQ?'Quote ':'Invoice ')+e.no+'\nFor: '+cnameE(e)+'\n'+e.type+(e.date?' on '+fmtLong(e.date):'')+(e.venue?' at '+e.venue:'')+'\n'+(c.g?c.g+' guests\n':'')+'\n';
 L.forEach(l=>{t+=l.desc+(l.qty>1?' ('+l.qty+' x '+money(l.rate)+')':'')+': '+money(l.amt)+'\n'});
 t+='\nSubtotal: '+money(c.sub)+'\n'+(c.tax?'Sales tax: '+money(c.tax)+'\n':'')+'Total: '+money(c.total)+'\n';
 if(isQ)t+='Deposit to hold the date: '+money(c.deposit)+'\n';else{const p=paidAmt(e);if(p)t+='Paid: '+money(p)+'\n';t+='Balance due: '+money(balance(e))+(e.dueDate&&balance(e)>0?' by '+fmtDate(e.dueDate):'')+'\n'}
 if(e.notes)t+='\n'+e.notes+'\n';if(s.footer)t+='\n'+s.footer;return t}
function pdfLib(){return window.jspdf&&window.jspdf.jsPDF}
async function buildPdf(e){
 const lib=pdfLib();if(!lib)throw new Error('PDF library not loaded');
 const c=calc(e),cu=cust(e.custId)||{name:''},s=S.settings,L=docLines(e),isQ=e.status==='quote',paid=paidAmt(e),bal=balance(e);
 const doc=new lib({unit:'pt',format:'letter'});
 const W=612,H=792,M=44,R=W-M,BOT=H-56;let y=0;
 const ink=()=>doc.setTextColor(26,26,26),grey=()=>doc.setTextColor(100,100,100);
 const need=h=>{if(y+h>BOT){doc.addPage();y=M}};
 const wrap=(txt,w)=>doc.splitTextToSize(String(txt==null?'':txt),w);
 const label=(txt,x,yy)=>{doc.setFont('helvetica','bold');doc.setFontSize(8);grey();doc.text(String(txt).toUpperCase(),x,yy)};
 doc.setFillColor(43,36,32);doc.rect(0,0,W,86,'F');doc.setFillColor(177,54,26);doc.rect(0,0,W,5,'F');
 doc.setTextColor(232,185,168);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('W E S T   E N D',M,38);
 doc.setTextColor(246,239,230);doc.setFontSize(30);doc.text('MEAT',M,68);
 doc.setFontSize(24);doc.text(docTitle(e),R,48,{align:'right'});doc.setFontSize(12);doc.text(e.no,R,68,{align:'right'});
 y=112;const top=y;
 doc.setFont('helvetica','bold');doc.setFontSize(12);ink();doc.text(s.bizName||'',M,y);y+=15;
 doc.setFont('helvetica','normal');doc.setFontSize(10);
 [s.address,[s.phone,s.email].filter(Boolean).join('  |  ')].filter(Boolean).forEach(l=>{wrap(l,300).forEach(x=>{doc.text(x,M,y);y+=13})});
 let ry=top;doc.setFontSize(10);
 const meta=isQ?[['Quote date',fmtDate(e.created)]]:[['Invoice date',fmtDate(e.invDate||today())],e.status==='paid'?['Status','Paid in full']:['Due',fmtDate(e.dueDate)]];
 meta.forEach(p=>{doc.setFont('helvetica','normal');grey();doc.text(p[0],R-130,ry);ink();doc.setFont('helvetica','bold');doc.text(p[1],R,ry,{align:'right'});ry+=14});
 if(e.status==='paid'){doc.setDrawColor(27,117,71);doc.setLineWidth(1.6);doc.setTextColor(27,117,71);doc.setFontSize(14);doc.roundedRect(R-70,ry+2,70,24,3,3,'S');doc.text('PAID',R-35,ry+19,{align:'center'});ry+=28;ink()}
 y=Math.max(y,ry)+18;
 label('Bill to',M,y);label('Event',M+280,y);y+=14;
 doc.setFontSize(11);doc.setFont('helvetica','bold');ink();doc.text(cu.name||'',M,y);doc.text(e.type||'',M+280,y);
 doc.setFont('helvetica','normal');doc.setFontSize(10);
 let ly=y+14,ey=y+14;
 addrLines(cu).forEach(l=>wrap(l,240).forEach(x=>{doc.text(x,M,ly);ly+=13}));if(cu.phone){doc.text(cu.phone,M,ly);ly+=13}
 [evDateStr(e),e.venue,c.g?c.g+' guests':''].filter(Boolean).forEach(l=>wrap(l,240).forEach(x=>{doc.text(x,M+280,ey);ey+=13}));
 y=Math.max(ly,ey)+14;
 const cQ=R-190,cP=R-100,cA=R;
 doc.setDrawColor(26,26,26);doc.setLineWidth(1.5);doc.line(M,y,R,y);y+=14;
 label('Description',M,y);doc.setFont('helvetica','bold');doc.setFontSize(8);grey();doc.text('QTY',cQ,y,{align:'right'});doc.text('PRICE',cP,y,{align:'right'});doc.text('AMOUNT',cA,y,{align:'right'});
 y+=6;doc.setDrawColor(200,200,200);doc.setLineWidth(.7);doc.line(M,y,R,y);y+=15;doc.setFontSize(10);
 L.forEach(l=>{const d=wrap(l.desc,cQ-M-50);const h=d.length*13+6;need(h);
  doc.setFont('helvetica','normal');ink();d.forEach((x,i)=>doc.text(x,M,y+i*13));
  doc.text(String(l.qty),cQ,y,{align:'right'});doc.text(money(l.rate),cP,y,{align:'right'});doc.text(money(l.amt),cA,y,{align:'right'});
  y+=h-2;doc.setDrawColor(225,225,225);doc.line(M,y,R,y);y+=13});
 need(110);y+=2;
 const tl=(a,b,bold)=>{doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(bold?12:10);ink();doc.text(a,cP-30,y,{align:'right'});doc.text(b,cA,y,{align:'right'});y+=bold?18:14};
 tl('Subtotal',money(c.sub));if(c.tax)tl('Sales tax',money(c.tax));if(e.exempt)tl('Tax exempt','');
 doc.setDrawColor(26,26,26);doc.setLineWidth(1.2);doc.line(cP-110,y-8,R,y-8);y+=4;tl('Total',money(c.total),true);
 if(isQ)tl('Deposit to hold the date ('+num(s.depositPct)+'%)',money(c.deposit));
 else{(e.payments||[]).forEach(p=>tl('Payment '+fmtDate(p.date)+' ('+p.method+')','-'+money(num(p.amt))));tl(bal<=0.004?'Balance':'Balance due',money(bal),true)}
 y+=8;
 if(e.notes){const lines=[];String(e.notes).split('\n').forEach(r=>wrap(r,R-M-24).forEach(x=>lines.push(x)));const h=lines.length*13+30;need(h+8);
  doc.setDrawColor(200,200,200);doc.setLineWidth(.8);doc.roundedRect(M,y,R-M,h,4,4,'S');label('Notes',M+12,y+16);doc.setFont('helvetica','normal');doc.setFontSize(10);ink();lines.forEach((x,i)=>doc.text(x,M+12,y+32+i*13));y+=h+12}
 const tail=wrap(s.terms||'',R-M),foot=wrap(s.footer||'',R-M);
 need(tail.length*12+foot.length*12+18);y+=6;
 doc.setFont('helvetica','normal');doc.setFontSize(9);grey();tail.forEach(x=>{doc.text(x,M,y);y+=12});y+=4;foot.forEach(x=>{doc.text(x,M,y);y+=12});
 const n=doc.getNumberOfPages();
 for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);grey();doc.text((s.bizName||'')+'  |  '+(isQ?'Quote ':'Invoice ')+e.no,M,H-28);doc.text('Page '+i+' of '+n,R,H-28,{align:'right'})}
 return doc.output('blob')}
let PDF={id:'',file:null,err:false};
function setShareBtn(){const b=document.getElementById('btn-share');if(!b)return;b.disabled=!PDF.file&&!PDF.err;b.textContent=(PDF.file||PDF.err)?'Share PDF':'Preparing PDF…'}
function prepPdf(e){const id=e.id;PDF={id,file:null,err:false};setShareBtn();
 const go=(tries)=>buildPdf(e).then(b=>{if(PDF.id!==id)return;PDF.file=new File([b],pdfName(e),{type:'application/pdf'});setShareBtn()}).catch(x=>{if(PDF.id!==id)return;if(tries>0){setTimeout(()=>go(tries-1),1200);return}PDF.err=true;setShareBtn()});
 go(4)}

/* ---------- Money ---------- */
function allYears(){const ys=new Set([new Date().getFullYear()]);S.expenses.forEach(x=>ys.add(+x.date.slice(0,4)));S.events.forEach(e=>(e.payments||[]).forEach(p=>ys.add(+p.date.slice(0,4))));return Array.from(ys).filter(Boolean).sort((a,b)=>b-a)}
function moneyData(y){const pays=[];S.events.forEach(e=>(e.payments||[]).forEach(p=>{if(+p.date.slice(0,4)===y)pays.push(Object.assign({e},p))}));
 const exps=S.expenses.filter(x=>+x.date.slice(0,4)===y);return{pays,exps,inc:r2(sum(pays.map(p=>num(p.amt)))),exp:r2(sum(exps.map(x=>num(x.amount))))}}
function moneyView(){const y=year,d=moneyData(y);const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
 const mrows=MN.map((m,i)=>{const mi=r2(sum(d.pays.filter(p=>+p.date.slice(5,7)===i+1).map(p=>num(p.amt))));const me=r2(sum(d.exps.filter(x=>+x.date.slice(5,7)===i+1).map(x=>num(x.amount))));return[m,mi,me]});
 const maxv=Math.max(1,...mrows.map(r=>Math.max(r[1],r[2])));
 const cats=EXP_CATS.map(c=>[c,r2(sum(d.exps.filter(x=>x.cat===c).map(x=>num(x.amount))))]).filter(r=>r[1]>0);
 const jobs=S.events.filter(e=>e.status!=='quote'&&e.date&&+e.date.slice(0,4)===y).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{const c=calc(e);const ex=r2(sum(S.expenses.filter(x=>x.eventId===e.id).map(x=>num(x.amount))));return{e,rev:c.sub,ex,pr:r2(c.sub-ex)}});
 const q=[1,2,3,4].map(n=>{const es=S.events.filter(e=>e.status!=='quote'&&e.date&&+e.date.slice(0,4)===y&&Math.ceil(+e.date.slice(5,7)/3)===n);let sales=0,ex=0,tax=0;es.forEach(e=>{const c=calc(e);sales+=c.sub;if(e.exempt)ex+=c.sub;tax+=c.tax});return[n,r2(sales),r2(ex),r2(sales-ex),r2(tax)]});
 return `<div class="vhead"><div><h2>Money</h2><p>Cash basis: income counts when a payment is recorded.</p></div><div class="row2"><select class="ys" data-act="yearSel" aria-label="Year">${allYears().map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}</select><button class="btn pri" data-act="addExpense">Add expense</button></div></div>
 <div class="tiles"><div class="tile"><small>Income</small><b>${money(d.inc)}</b><em>${d.pays.length} ${d.pays.length===1?'payment':'payments'}</em></div><div class="tile"><small>Expenses</small><b>${money(d.exp)}</b><em>${d.exps.length} ${d.exps.length===1?'entry':'entries'}</em></div><div class="tile ${d.inc-d.exp<0?'warn':''}"><small>Net</small><b>${money(d.inc-d.exp)}</b><em>before income tax</em></div></div>
 <fieldset><legend>By month</legend><div class="scroll"><table class="bars"><thead><tr><th>Month</th><th class="r">Income</th><th class="r">Expenses</th><th class="r">Net</th></tr></thead><tbody>${mrows.map(r=>`<tr><td>${r[0]}</td><td class="r num">${money(r[1])}</td><td class="r num">${money(r[2])}</td><td class="r num">${money(r[1]-r[2])}</td></tr>`).join('')}<tr class="tot"><td>Total</td><td class="r num">${money(d.inc)}</td><td class="r num">${money(d.exp)}</td><td class="r num">${money(d.inc-d.exp)}</td></tr></tbody></table></div></fieldset>
 <fieldset><legend>Profit by job</legend>${jobs.length?`<div class="scroll"><table><thead><tr><th>Event</th><th class="r">Billed</th><th class="r">Expenses</th><th class="r">Profit</th></tr></thead><tbody>${jobs.map(j=>`<tr><td><a href="#" data-act="openEv" data-id="${j.e.id}">${esc(cnameE(j.e))}</a><br><small>${esc(fmtDate(j.e.date))}</small></td><td class="r num">${money(j.rev)}</td><td class="r num">${money(j.ex)}</td><td class="r num">${money(j.pr)}</td></tr>`).join('')}</tbody></table></div><p class="hint">Billed is before sales tax. Expenses are the ones tagged to that job.</p>`:'<p class="hint">No booked events in this year.</p>'}</fieldset>
 <fieldset><legend>Expenses by category</legend>${cats.length?cats.map(r=>kv(esc(r[0]),money(r[1]))).join(''):'<p class="hint">No expenses yet.</p>'}</fieldset>
 <fieldset><legend>Expenses</legend>${d.exps.length?d.exps.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>{const e=evt(x.eventId);return `<div class="mrow" data-act="openExp" data-id="${x.id}" role="button" tabindex="0" style="cursor:pointer"><span style="flex:1;min-width:0"><b>${esc(x.note||x.cat)}</b><br><small class="pill">${esc(fmtDate(x.date))} · ${esc(x.cat)}${e?' · '+esc(cnameE(e)):''}</small></span><span class="pp">${money(num(x.amount))}</span></div>`}).join(''):'<p class="hint">No expenses in this year.</p>'}</fieldset>
 <fieldset><legend>Income (payments received)</legend>${d.pays.length?d.pays.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<div class="mrow" data-act="openEv" data-id="${p.e.id}" role="button" tabindex="0" style="cursor:pointer"><span style="flex:1;min-width:0"><b>${esc(cnameE(p.e))}</b><br><small class="pill">${esc(fmtDate(p.date))} · ${esc(p.method)}${p.note?' · '+esc(p.note):''}</small></span><span class="pp">${money(num(p.amt))}</span></div>`).join(''):'<p class="hint">No payments in this year.</p>'}</fieldset>
 <fieldset><legend>Sales tax by quarter (by event date)</legend><div class="scroll"><table><thead><tr><th>Qtr</th><th class="r">Sales</th><th class="r">Exempt</th><th class="r">Taxable</th><th class="r">Tax</th></tr></thead><tbody>${q.map(r=>`<tr><td>Q${r[0]}</td><td class="r num">${money(r[1])}</td><td class="r num">${money(r[2])}</td><td class="r num">${money(r[3])}</td><td class="r num">${money(r[4])}</td></tr>`).join('')}</tbody></table></div><p class="hint">Set your tax rate in Settings. Check the filing rules with your state or your accountant.</p></fieldset>
 <div class="btnrow"><button class="btn" data-act="csvExp">Export expenses (CSV)</button><button class="btn" data-act="csvInc">Export income (CSV)</button><button class="btn" data-act="csvEv">Export events (CSV)</button></div>`}

 <fieldset><legend>Backup</legend><p class="hint" style="margin-top:0">Everything is saved in this browser. Download a backup now and then.</p><div class="btnrow"><button class="btn" data-act="backup">Download backup</button><label class="btn" style="text-align:center;cursor:pointer">Restore from backup<input type="file" id="restore" accept=".html,.json,text/html,application/json" hidden></label></div>

/* ---------- backup ---------- */
function backupHtml(){const data=JSON.stringify({app:'west-end-meat',saved:new Date().toISOString(),data:S}).replace(/</g,'\\u003c');
 const T=(h,rows)=>'<table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+h.length+'">None</td></tr>')+'</tbody></table>';
 const cs=S.customers.map(c=>[c.name,c.phone,c.email,addrLines(c).join(', '),c.taxExempt?'Yes':'',c.notes]);
 const es=S.events.map(e=>{const c=calc(e);return[e.no,e.date,cnameE(e),e.type,c.g,e.status,money(c.total),money(paidAmt(e))]});
 const xs=S.expenses.map(x=>[x.date,x.cat,money(x.amount),x.note]);
 return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>West End Meat backup '+today()+'</title><style>body{font:14px system-ui,sans-serif;margin:24px;color:#2a211c;max-width:1100px}h2{margin:28px 0 6px}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ddd1c0;padding:6px 8px;text-align:left;font-size:13px}th{font-size:11px;text-transform:uppercase;color:#6e5f53}</style></head><body><h1>West End Meat backup</h1><p>Saved '+esc(fmtDate(today()))+'. To restore, open the app, go to Settings, tap Restore from backup and choose this file.</p><h2>Customers ('+cs.length+')</h2>'+T(['Name','Phone','Email','Address','Tax exempt','Notes'],cs)+'<h2>Events ('+es.length+')</h2>'+T(['No.','Date','Customer','Type','Guests','Status','Total','Paid'],es)+'<h2>Expenses ('+xs.length+')</h2>'+T(['Date','Category','Amount','Note'],xs)+'<script id="wem-data" type="application/json">'+data+'<\/script></body></html>'}
function parseBackup(txt){const m=String(txt).match(/<script id="wem-data" type="application\/json">([\s\S]*?)<\/script>/);return JSON.parse(m?m[1]:txt)}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=parseBackup(r.result);if(!o.data||!o.data.events)throw 0;S=merge(o.data);ensureQ();persist();render();toast('Backup restored')}catch(e){toast('That file is not a West End Meat backup')}};r.readAsText(f)}

/* ---------- actions ---------- */
function goQuote(){closeModal();S.tab='quote';persist();render();window.scrollTo(0,0)}
const acts={
 tab(el){S.tab=el.dataset.t;srch='';$('#q').value='';persist();render();window.scrollTo(0,0)},
 closeModal(){closeModal()},
 closePrice(){closeModal();render()},
 newQuote(){S.q=null;ensureQ();goQuote()},
 quoteFor(el){const c=cust(el.dataset.id);if(!c)return;S.q=null;ensureQ();Q.cust=c.name;Q.phone=c.phone||'';Q.email=c.email||'';if(c.taxExempt)Q.exempt=true;goQuote()},
 pickCust(el){const c=cust(el.dataset.id);if(!c)return;Q.cust=c.name;Q.phone=c.phone||Q.phone;Q.email=c.email||Q.email;if(c.taxExempt)Q.exempt=true;persist();hideCustPop();render()},
 priceModal(){priceModal()},
 addExtra(){Q.extras.push({id:uid(),desc:'',amt:''});persist();render()},
 delExtra(el){Q.extras.splice(+el.dataset.id,1);persist();render()},
 clearQuote(){S.q=null;ensureQ();persist();render();toast('Cleared')},
 repriceQ(){Q.snap=null;persist();refreshQuote();toast('Using today\'s prices')},
 cancelEdit(){S.q=null;ensureQ();persist();S.tab='events';render()},
 copyEstimate(){const sp=qSpec();copyText(estText(sp,calc(sp)))},
 qOrder(){const sp=qSpec();const t=typeOf(Q.type);openOrder(sp,(Q.cust||'Quote')+' · '+(t?t.name:''),fmtLong(Q.date),'<button class="btn sm" data-act="closeModal">Close</button>')},
 saveQuote(){saveQuote()},
 evf(el){S.evf=el.dataset.f;persist();render()},
 openEv(el){closeModal();openEvent(el.dataset.id)},
 backEv(el){closeModal();openEvent(el.dataset.id)},
 editEv(el){const e=evt(el.dataset.id);if(!e)return;const cu=cust(e.custId)||{};const snapMap={};e.menu.forEach(m=>snapMap[m.id]=m);
  const qt={};e.menu.forEach(m=>{if(m.qty!=null)qt[m.id]=String(m.qty)});S.q={mode:e.mode||'person',qtys:qt,id:e.id,cust:cu.name||'',phone:cu.phone||'',email:cu.email||'',type:e.typeId,date:e.date||'',time:e.time||'',guests:String(e.guests),venue:e.venue||'',items:e.menu.map(m=>m.id),svcPP:String(e.svcPP),flat:String(e.flat),flatLabel:e.flatLabel||'',exempt:!!e.exempt,extras:(e.extras||[]).map(x=>({id:x.id,desc:x.desc,amt:x.amt})),notes:e.notes||'',itemize:e.itemize!==false,snap:snapMap};
  ensureQ();goQuote()},
 setBooked(el){setBooked(el.dataset.id)},
 makeInvoice(el){makeInvoice(el.dataset.id)},
 openDoc(el){closeModal();openDoc(el.dataset.id)},
 printDoc(){try{window.print()}catch(e){}},
 copyDoc(el){copyText(docText(evt(el.dataset.id)))},
 async sharePdf(el){const e=evt(el.dataset.id);if(!e)return;
  if(PDF.err||!PDF.file){if(PDF.err){toast('Could not build the PDF. Check your connection and try again.');prepPdf(e)}return}
  const f=PDF.file;
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:f.name});if(e.status!=='quote'&&!e.sentOn){e.sentOn=today();persist()}return}}catch(x){if(x&&x.name==='AbortError')return}
  if(await saveBlob(f.name,f))toast('PDF saved')},
 markSent(el){const e=evt(el.dataset.id);if(!e)return;e.sentOn=today();persist();render();openEvent(e.id)},
 unsent(el){const e=evt(el.dataset.id);if(!e)return;e.sentOn='';persist();render();openEvent(e.id)},
 recordPay(el){openPay(el.dataset.id)},
 savePay(el){savePay(el.dataset.id)},
 delPay(el){const e=evt(el.dataset.id);if(!e||!confirm('Delete this payment?'))return;e.payments=e.payments.filter(p=>p.id!==el.dataset.p);normStatus(e);persist();render();openEvent(e.id)},
 delEv(el){const e=evt(el.dataset.id);if(!e||!confirm('Delete this event and its payments? Expenses tagged to it stay as general expenses.'))return;S.expenses.forEach(x=>{if(x.eventId===e.id)x.eventId=''});S.events=S.events.filter(z=>z.id!==e.id);persist();closeModal();render();toast('Event deleted')},
 evOrder(el){const e=evt(el.dataset.id);if(!e)return;openOrder(e,cnameE(e)+' · '+e.type,fmtLong(e.date),`<button class="btn sm" data-act="backEv" data-id="${e.id}">Back</button>`)},
 copyOrder(){const c=window.__orderCtx;if(c)copyText(orderText(c.x,c.title,c.dateLine))},
 newCust(){openCust('')},openCust(el){closeModal();openCust(el.dataset.id)},saveCust(el){saveCust(el.dataset.id)},
 delCust(el){const id=el.dataset.id;if(S.events.some(e=>e.custId===id)){toast('This customer has events. Delete those first.');return}if(!confirm('Delete this customer?'))return;S.customers=S.customers.filter(c=>c.id!==id);persist();closeModal();render()},
 addExpense(el){const id=el&&el.dataset&&el.dataset.id;closeModalKeepDraft();openExp('',id||'')},
 openExp(el){closeModalKeepDraft();openExp(el.dataset.id)},saveExp(el){saveExp(el.dataset.id)},
 delExp(el){if(!confirm('Delete this expense?'))return;S.expenses=S.expenses.filter(x=>x.id!==el.dataset.id);persist();closeModal();render()},
 yearSel(el){},
 addItem(){S.settings.menu.push({id:uid(),name:'New item',cat:'Sides',unit:'lb',portion:0.25,yield:100,cost:0,markup:'',upd:''});persist();render()},
 delItem(el){const id=el.dataset.id;if(!confirm('Remove this menu item? Saved events keep it.'))return;S.settings.menu=S.settings.menu.filter(m=>m.id!==id);S.settings.types.forEach(t=>t.items=t.items.filter(i=>i!==id));Q.items=Q.items.filter(i=>i!==id);persist();render()},
 addType(){S.settings.types.push({id:uid(),name:'New event',mode:'person',svcPP:0,flat:0,flatLabel:'Delivery',exempt:false,items:[]});persist();render()},
 delType(el){if(S.settings.types.length<2){toast('Keep at least one event type');return}if(!confirm('Remove this event type?'))return;S.settings.types=S.settings.types.filter(t=>t.id!==el.dataset.id);if(!typeOf(Q.type))Object.assign(Q,typeDefaults(S.settings.types[0]));persist();render()},
 backup(){saveFile('West-End-Meat-backup-'+today()+'.html',backupHtml(),'text/html')},
 clearSample(){if(!confirm('Remove all sample customers, events and expenses? Your prices and settings stay.'))return;S.customers=[];S.events=[];S.expenses=[];S.nextNo=1;S.sample=false;S.q=null;ensureQ();persist();render();toast('Sample data cleared')},
 loadSample(){if(!confirm('Add sample data? This replaces your customers, events and expenses.'))return;const d=seed();S.customers=d.customers;S.events=d.events;S.expenses=d.expenses;S.nextNo=d.nextNo;S.sample=true;persist();render()},
 csvExp(){saveFile('expenses-'+year+'.csv',csv([['Date','Category','Amount','Job','Note']].concat(moneyData(year).exps.map(x=>[x.date,x.cat,x.amount,(evt(x.eventId)?cnameE(evt(x.eventId)):''),x.note]))),'text/csv')},
 csvInc(){saveFile('income-'+year+'.csv',csv([['Date','Customer','Event','Method','Amount','Note']].concat(moneyData(year).pays.map(p=>[p.date,cnameE(p.e),p.e.no,p.method,p.amt,p.note]))),'text/csv')},
 csvEv(){saveFile('events.csv',csv([['No','Date','Customer','Type','Guests','Status','Subtotal','Tax','Total','Paid','Balance']].concat(S.events.map(e=>{const c=calc(e);return[e.no,e.date,cnameE(e),e.type,c.g,e.status,c.sub,c.tax,c.total,paidAmt(e),balance(e)]}))),'text/csv')}
};
function closeModalKeepDraft(){$('#modal').innerHTML='';document.body.style.overflow=''}
document.addEventListener('click',e=>{if(!e.target.closest('.acwrap'))hideCustPop();const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='SELECT')return;const f=acts[el.dataset.act];if(f){e.preventDefault();f(el)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}if(e.key==='Escape'&&$('#modal').innerHTML)closeModal()});

/* ---------- field handling ---------- */
function onField(e){const t=e.target;if(!t||!t.dataset)return;const d=t.dataset;
 if(t.id==='q'){srch=t.value;render();const q=$('#q');if(q){q.focus();try{q.setSelectionRange(q.value.length,q.value.length)}catch(x){}}return}
 if(t.id==='restore'){restore(t.files[0]);t.value='';return}
 if(t.dataset.act==='yearSel'&&e.type==='change'){year=+t.value;render();return}
 if(d.q!==undefined){const k=d.q;
  if(k==='type'){if(e.type==='change')applyType(t.value);return}
  if(k==='mode'){if(e.type==='change'){Q.mode=t.value;persist();render()}return}
  Q[k]=t.type==='checkbox'?t.checked:t.value;
  if(k==='cust'){showCustPop()}
  if(k==='phone'&&e.type==='change')Q.phone=fmtPhoneSave(t.value);
  persist();refreshQuote();return}
 if(d.qi!==undefined){if(e.type==='change')toggleItem(d.qi,t.checked);return}
 if(d.qq!==undefined){Q.qtys=Q.qtys||{};Q.qtys[d.qq]=t.value;persist();refreshQuote();return}
 if(d.qx!==undefined){const p=d.qx.split(':');Q.extras[+p[0]][p[1]]=t.value;persist();refreshQuote();return}
 if(d.s!==undefined){S.settings[d.s]=t.type==='checkbox'?t.checked:t.value;persist();if(d.s==='markup'||d.s==='overage'||d.s==='taxRate'||d.s==='depositPct'){S.settings.menu.forEach(m=>updateMenuCalc(m.id))}return}
 if(d.m!==undefined){const p=d.m.split('|'),it=menuItem(p[0]);if(!it)return;it[p[1]]=t.value;if(p[1]==='cost')it.upd=today();persist();updateMenuCalc(it.id);refreshQuote();if(p[1]==='cat'&&e.type==='change')render();return}
 if(d.t!==undefined){const p=d.t.split('|'),ty=typeOf(p[0]);if(!ty)return;ty[p[1]]=t.type==='checkbox'?t.checked:t.value;persist();return}
 if(d.ti!==undefined){const p=d.ti.split('|'),ty=typeOf(p[0]);if(!ty||e.type!=='change')return;const i=ty.items.indexOf(p[1]);if(t.checked&&i<0)ty.items.push(p[1]);if(!t.checked&&i>=0)ty.items.splice(i,1);persist();return}
 if(d.e!==undefined){const ev=evt(d.eid);if(!ev)return;ev[d.e]=t.value;persist();return}
}
document.addEventListener('input',e=>{const t=e.target;if(!t)return;
 if(t.id==='cu-name'||t.id==='f-cust'||(t.id==='cu-street')||(t.id==='cu-city')){const v=capWords(t.value);if(v!==t.value){const a=t.selectionStart,b=t.selectionEnd;t.value=v;try{t.setSelectionRange(a,b)}catch(x){}}}
 if(t.id==='cu-phone'||(t.dataset&&t.dataset.q==='phone')){const v=fmtPhoneLive(t.value);if(v!==t.value)t.value=v}});
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('focusin',e=>{if(e.target.id==='f-cust')showCustPop()});

/* keyboard: keep sheet footers fixed at the bottom while typing */
let kbT=null,ptrDown=false;
function syncKb(){const sh=document.querySelector('#modal .sheet');if(!sh)return;const a=document.activeElement;
 const typing=!!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!/^(checkbox|radio|file|button|submit)$/.test(a.type||'')&&sh.contains(a));
 if(typing){sh.classList.add('kb');if(!sh.querySelector('.sfoot-inline')){const f=sh.querySelector('.sfoot');if(f){const c=f.cloneNode(true);c.className='sfoot-inline';c.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));const b=sh.querySelector('.sbody');if(b)b.appendChild(c)}}}
 else if(!ptrDown){sh.classList.remove('kb');const c=sh.querySelector('.sfoot-inline');if(c)c.remove()}}
document.addEventListener('focusin',()=>{clearTimeout(kbT);syncKb()});
document.addEventListener('focusout',()=>{clearTimeout(kbT);kbT=setTimeout(syncKb,250)});
document.addEventListener('pointerdown',e=>{ptrDown=!!e.target.closest('.sfoot-inline')},true);
document.addEventListener('pointerup',()=>{if(ptrDown)setTimeout(()=>{ptrDown=false;syncKb()},500)},true);

/* ---------- autosave of open customer / expense / payment forms ---------- */
const DK='west-end-meat-draft';
function saveDraft(){try{if(!MODAL||!document.querySelector('#modal .sheet'))return;if(!['cust','exp','pay'].includes(MODAL.kind))return;
 const v={};document.querySelectorAll('#modal [id^=cu-],#modal [id^=ex-],#modal [id^=pm-]').forEach(i=>{v[i.id]=i.type==='checkbox'?i.checked:i.value});localStorage.setItem(DK,JSON.stringify({m:MODAL,v}))}catch(e){}}
function clearDraft(){try{localStorage.removeItem(DK)}catch(e){}}
function restoreDraft(){let d=null;try{d=JSON.parse(localStorage.getItem(DK)||'null')}catch(e){}if(!d||$('#modal').innerHTML)return;const m=d.m;
 if(m.kind==='cust'){if(m.id&&!cust(m.id)){clearDraft();return}openCust(m.id)}else if(m.kind==='exp'){openExp(m.id,m.preEv)}else if(m.kind==='pay'){if(!evt(m.id)){clearDraft();return}openPay(m.id)}else return;
 Object.keys(d.v).forEach(k=>{const e=document.getElementById(k);if(e){if(e.type==='checkbox')e.checked=!!d.v[k];else e.value=d.v[k]}});toast('Restored what you were entering')}
['input','change'].forEach(ev=>document.addEventListener(ev,()=>{setTimeout(saveDraft,0)}));

/* ---------- boot ---------- */
render();
restoreDraft();
})();
</script>
